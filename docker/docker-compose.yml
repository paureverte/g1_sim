services:
  g1_sim:
    image: g1_sim:jazzy
    container_name: g1_sim_jazzy
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    user: user
    network_mode: host
    ipc: host
    privileged: true
    tty: true
    stdin_open: true
    
    volumes:
      # Map the workspace
      - ..:/home/user/workspace
      # Cyclone DDS configuration
      - ./cyclonedds_config.xml:/home/user/.cyclonedds_config.xml:ro
      # Graphics (X11)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/home/user/.Xauthority:rw

    devices:
      - /dev/bus/usb:/dev/bus/usb
      - /dev/dri:/dev/dri # Hardware acceleration

    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/home/user/.Xauthority
      - CYCLONEDDS_URI=file:///home/user/.cyclonedds_config.xml
      - UNITREE_MUJOCO_DIR=/home/user/workspace/third_party/unitree_mujoco
      - MUJOCO_HOME=/opt/mujoco/mujoco-3.3.6
      - G1_SIM_AUTOBUILD=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=1
      - ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET
      - "RCUTILS_CONSOLE_OUTPUT_FORMAT=[{name}] [{severity}]: {message}"
      - RCUTILS_COLORIZED_OUTPUT=1
      - TERM=xterm-256color
      - COLORTERM=truecolor